name: Deploy Astro SSR Production (Rsync Build)

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deployment-astro
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy via Rsync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro SSR application
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
        run: npm run build

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload built files via rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          rsync -az \
            --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22}" \
            ./ \
            "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Restart application on server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" << 'EOF'
              set -e

              cd "$VPS_PATH"

              pm2 restart albran-printing --update-env || pm2 start ./dist/server/entry.mjs --name "albran-printing"
              
              pm2 save
          EOF
